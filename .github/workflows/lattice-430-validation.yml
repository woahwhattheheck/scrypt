name: Lattice scrypt 430 write-error validation
on:
  push:
    branches:
      - review/lattice-430-write-error-20260906
    paths:
      - tests/lattice-430/**
      - .github/workflows/lattice-430-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install native build and memory tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake autoconf-archive libtool libssl-dev valgrind
      - name: Build exact revisions and exercise native write-error paths
        run: python3 tests/lattice-430/run.py lattice-430-results
      - name: Preserve raw logs and allocation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lattice-430-write-error-evidence
          path: lattice-430-results
          if-no-files-found: error
          retention-days: 14
