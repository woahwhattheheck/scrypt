name: Repro - unauthenticated plaintext left on disk

on:
  push:
    branches:
      - bugreport/unauth-plaintext-on-hmac-failure

jobs:
  repro:
    name: Repro
    runs-on: ubuntu-22.04
    steps:
    - name: Install software
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y autoconf-archive
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Build
      run: |
        autoreconf -i
        ./configure
        make
    - name: Repro
      run: |
        set -x
        SCRYPT=./scrypt
        PW=hunter2
        # Fast KDF params; -f skips the resource checks.
        P="-f --logN 10 -r 1 -p 1 --passphrase dev:stdin-once"

        # A 1000-byte plaintext: well under ENCBLOCK, to show the leak is
        # NOT limited to large files.
        python3 -c "import sys; sys.stdout.write('A'*1000)" > plain.txt
        wc -c plain.txt

        echo "$PW" | $SCRYPT enc $P plain.txt good.enc
        wc -c good.enc

        echo "===== CASE 1: truncated ciphertext (drop last byte) ====="
        head -c $(( $(wc -c < good.enc) - 1 )) good.enc > trunc.enc
        wc -c trunc.enc
        rm -f out1.txt
        set +e
        echo "$PW" | $SCRYPT dec $P trunc.enc out1.txt
        echo "scrypt dec exit status: $?"
        set -e
        echo "--- out1.txt left behind? ---"
        ls -l out1.txt || echo "ABSENT (good)"
        echo "bytes written: $(wc -c < out1.txt 2>/dev/null || echo 0)"
        echo "first 64 bytes:"; head -c 64 out1.txt | od -c | head -4

        echo "===== CASE 2: bit-flip in body (attacker-controlled output) ====="
        # Flip the low bit of ciphertext byte 96 (first body byte).  CTR mode
        # means this flips exactly the same bit of the decrypted plaintext.
        python3 - <<'PY'
        d = bytearray(open('good.enc','rb').read())
        d[96] ^= 0x01
        open('flip.enc','wb').write(bytes(d))
        PY
        rm -f out2.txt
        set +e
        echo "$PW" | $SCRYPT dec $P flip.enc out2.txt
        echo "scrypt dec exit status: $?"
        set -e
        echo "--- out2.txt left behind? ---"
        ls -l out2.txt || echo "ABSENT (good)"
        echo "bytes written: $(wc -c < out2.txt 2>/dev/null || echo 0)"
        echo "first byte should be 'A'^1 = '@':"; head -c 8 out2.txt | od -c | head -2
