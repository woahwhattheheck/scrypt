name: Repro - scrypt dec aborts on explicit params

on:
  push:
    branches:
      - bugreport/unauth-plaintext-on-hmac-failure

jobs:
  repro:
    name: Repro
    runs-on: ubuntu-22.04
    steps:
    - name: Install software
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y autoconf-archive
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Build
      run: |
        autoreconf -i
        ./configure
        make
        ./scrypt --version || true
    - name: Repro
      run: |
        SCRYPT=./scrypt
        PW=hunter2
        echo "AAAA" > plain.txt
        echo "$PW" | $SCRYPT enc -f --logN 10 -r 1 -p 1 --passphrase dev:stdin-once plain.txt good.enc

        echo "===== CONTROL: plain dec works ====="
        set +e
        echo "$PW" | $SCRYPT dec -f --passphrase dev:stdin-once good.enc ok.txt
        echo "control exit status: $?"
        set -e
        cmp plain.txt ok.txt && echo "control roundtrip OK"

        echo
        echo "===== BUG: dec with explicit params (documented as enc-only) ====="
        for ARGS in "--logN 10 -r 1 -p 1" "--logN 10 -r 1 -p 1" ; do :; done
        rm -f out.txt
        set +e
        echo "$PW" | $SCRYPT dec -f --logN 10 -r 1 -p 1 --passphrase dev:stdin-once good.enc out.txt
        rc=$?
        set -e
        echo "exit status: $rc   (134 = 128 + SIGABRT)"
        if [ "$rc" -eq 134 ]; then echo "RESULT: SIGABRT / assertion failure"; else echo "RESULT: exited $rc"; fi
        echo "--- was the output file created? ---"
        ls -l out.txt 2>/dev/null || echo "out.txt ABSENT - so no data loss, crash happens before the output is opened"

        echo
        echo "===== same via short-form -r / -p only (all-or-none rejects these) ====="
        set +e
        echo "$PW" | $SCRYPT dec -f -r 1 --passphrase dev:stdin-once good.enc out2.txt
        echo "  -r alone exit status: $? (expected 1, clean error)"
        set -e

        echo
        echo "===== info mode with explicit params (control) ====="
        set +e
        $SCRYPT info --logN 10 -r 1 -p 1 good.enc
        echo "  info exit status: $?"
        set -e
