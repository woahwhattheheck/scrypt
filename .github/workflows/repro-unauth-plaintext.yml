name: Argument matrix - look for signal deaths

on:
  push:
    branches:
      - bugreport/unauth-plaintext-on-hmac-failure

jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-22.04
    steps:
    - name: Install software
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y autoconf-archive
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Build
      run: |
        autoreconf -i
        ./configure
        make
    - name: Sweep
      run: |
        ulimit -c 0
        python3 - <<'PY'
        import itertools, subprocess, os, sys

        PW = b"hunter2\n"
        subprocess.run("echo AAAA > plain.txt", shell=True, check=True)
        subprocess.run('echo hunter2 | ./scrypt enc -f --logN 10 -r 1 -p 1 '
                       '--passphrase dev:stdin-once plain.txt good.enc',
                       shell=True, check=True)

        vals = {
            "-m":      ["0", "-1", "nan", "NaN", "inf", "-inf", "1e400", "0.5", "1", "2", ""],
            "-t":      ["0", "-1", "nan", "inf", "-inf", "1e400", ""],
            "-M":      ["0", "-1", "1", "1P", "abc", "18446744073709551616", ""],
            "--logN":  ["0", "9", "10", "41", "-1", "64", "18446744073709551616", ""],
            "-r":      ["0", "1", "33", "-1", "4294967296", ""],
            "-p":      ["0", "1", "2049", "-1", "4294967296", ""],
        }

        cases = []
        for mode in ("enc", "dec", "info"):
            for opt, vs in vals.items():
                for v in vs:
                    cases.append([mode, "-f", opt, v])
        # triples, since logN/r/p are all-or-none
        for mode in ("enc", "dec", "info"):
            for a in ["0", "10", "41", "-1"]:
                for b in ["0", "1", "33"]:
                    for c in ["0", "1", "2049"]:
                        cases.append([mode, "-f", "--logN", a, "-r", b, "-p", c])

        bad = []
        for i, extra in enumerate(cases):
            mode = extra[0]
            args = ["./scrypt"] + extra + ["--passphrase", "dev:stdin-once"]
            args += ["good.enc"] if mode != "enc" else ["plain.txt"]
            if mode != "info":
                args += ["/dev/null"]
            try:
                r = subprocess.run(args, input=PW, capture_output=True, timeout=25)
            except subprocess.TimeoutExpired:
                bad.append(("TIMEOUT", args, "")); continue
            if r.returncode < 0 or r.returncode >= 128:
                bad.append((r.returncode, args, r.stderr.decode()[-300:]))

        print("ran %d cases" % len(cases))
        if not bad:
            print("NO SIGNAL DEATHS")
        for rc, args, err in bad:
            print("=" * 70)
            print("rc=%s  %s" % (rc, " ".join(args)))
            print(err.strip())
        PY
