name: RIVET native negative-output assertion audit
on:
  push:
    branches: [review/rivet-432-passphrase-validation-20260906]
    paths:
      - .github/workflows/rivet-negative-output-validation.yml
permissions: {}
jobs:
  test-assertions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEAD: 3fcb6826f01157682038036fcea2620b3509a12c
    steps:
      - name: Retrieve exact source and additive test candidate
        shell: bash
        run: |
          set -euo pipefail
          git init -q source
          git -C source remote add origin https://github.com/woahwhattheheck/scrypt.git
          git -C source fetch --no-tags --depth=1 origin "$GITHUB_SHA" "$HEAD"
          git -C source checkout -q --detach "$GITHUB_SHA"
          git -C source worktree add --detach "$RUNNER_TEMP/rivet-negative-head" "$HEAD"
          mkdir -p evidence/build
          printf 'validation=%s\nimplementation=%s\n' "$GITHUB_SHA" "$HEAD" | tee evidence/revisions.txt
      - name: Build one real application for the new assertion audit
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/evidence/build"
          sudo apt-get update -qq > "$evidence/apt-update.log" 2>&1 || { tail -60 "$evidence/apt-update.log"; exit 1; }
          sudo apt-get install -y -qq autoconf automake autoconf-archive libtool libssl-dev > "$evidence/apt-install.log" 2>&1 || { tail -60 "$evidence/apt-install.log"; exit 1; }
          cd "$RUNNER_TEMP/rivet-negative-head"
          autoreconf -i > "$evidence/autoreconf.log" 2>&1 || { tail -80 "$evidence/autoreconf.log"; exit 1; }
          ./configure > "$evidence/configure.log" 2>&1 || { tail -80 "$evidence/configure.log"; exit 1; }
          make -j2 > "$evidence/make.log" 2>&1 || { tail -80 "$evidence/make.log"; exit 1; }
          printf 'BUILD PASS: %s\n' "$(git rev-parse HEAD)"
      - name: Test candidate against real binary and explicit output mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 source/tests/rivet-432/negative_outputs.py --built "$RUNNER_TEMP/rivet-negative-head" --patch source/tests/rivet-432/negative-output-targets.patch --output evidence/assertions | tee evidence/assertion-console.log
      - name: Retain assertion audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rivet-negative-output-audit
          path: evidence/
          retention-days: 14
          if-no-files-found: error
